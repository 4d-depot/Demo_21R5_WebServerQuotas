<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ticketing demo login</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fafaf8;color:#2b2b28;font:16px/1.5 -apple-system,Segoe UI,Helvetica,Arial,sans-serif}
    main{width:min(420px,calc(100% - 40px));padding:32px;background:#fff;border:1px solid #e2e0da;border-radius:8px}
    h1{margin:0 0 8px;font-size:26px}
    p{margin:0 0 20px;color:#767268}
    form{display:grid;gap:14px}
    label{display:grid;gap:5px;font-size:14px;font-weight:600}
    input{width:100%;padding:9px 10px;border:1px solid #e2e0da;border-radius:5px;font:inherit}
    button{border:1px solid #1764ac;background:#1764ac;color:#fff;padding:10px 16px;border-radius:5px;font-size:15px;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    #loginStatus{margin:14px 0 0;color:#b3492f}
  </style>
</head>
<body>
  <main>
    <h1>Ticketing demo</h1>
    <p>Start a signed-in visitor session to try the per-session request quota.</p>
    <form id="loginForm">
      <label for="identifier">Identifier</label>
      <input id="identifier" name="identifier" type="text" autocomplete="username" value="mary@4d.com" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" value="a" required>
      <button id="loginButton" type="submit">Log in</button>
    </form>
    <p>These credentials are for demo purposes only. They are not verified or sent to the server.</p>
    <p id="loginStatus" role="status" aria-live="polite"></p>
  </main>
  <script>
    const loginForm = document.getElementById('loginForm');
    const loginButton = document.getElementById('loginButton');
    const loginStatus = document.getElementById('loginStatus');

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      loginStatus.textContent = '';

      try {
        const response = await fetch('http://127.0.0.1/runDemo?authenticate=true', {
          method: 'POST',
          credentials: 'include',
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        window.location.assign('./ticketingSession.html');
      } catch (error) {
        loginButton.disabled = false;
        loginStatus.textContent = `Unable to start the session: ${error.message}`;
      }
    });
  </script>
</body>
</html>
